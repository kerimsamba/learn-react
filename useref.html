<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>useRef Mastery — Learn React Hooks</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--bg2:#111627;--card:#181d30;--card2:#1e2540;
  --line:#2a3155;--text:#e4e8f7;--muted:#8b93b8;
  --brand:#61dafb;--brand-dim:rgba(97,218,251,.12);
  --purple:#7c5cff;--green:#4ade80;--red:#f87171;--amber:#ffb454;
  --radius:16px;--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* ── Header ── */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(10,14,26,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:50;flex-shrink:0}
.topbar .back{color:var(--brand);text-decoration:none;font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px}
.topbar .spacer{flex:1}
.topbar .phase-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.progress-track{height:4px;background:var(--line);border-radius:2px;flex-shrink:0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--purple));border-radius:2px;transition:width .4s var(--ease)}

/* ── Screen container ── */
.screen-wrap{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.screen{min-height:100%;padding:20px 16px calc(20px + var(--safe-b));display:flex;flex-direction:column;gap:16px;animation:fadeUp .35s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ── Bottom nav ── */
.bottombar{display:flex;gap:8px;padding:10px 16px calc(10px + var(--safe-b));background:rgba(10,14,26,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);flex-shrink:0;z-index:50}
.bottombar .btn{flex:1}
.bottombar .btn.primary{background:var(--brand);color:#06222c}
.bottombar .btn.primary:disabled{background:var(--line);color:var(--muted)}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;transition:border-color .2s}
.card-header{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px}
.card-title{font-size:20px;font-weight:700;line-height:1.2;margin-bottom:8px}
.card-text{color:var(--muted);font-size:15px;line-height:1.5}

/* ── Buttons ── */
.btn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;font-size:15px;font-weight:600;padding:12px 18px;border-radius:12px;cursor:pointer;min-height:48px;transition:all .15s var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent;user-select:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:10px}
.btn.primary{background:var(--brand);color:#06222c;border-color:var(--brand);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.danger{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.3);color:var(--red)}
.btn.success{background:rgba(74,222,128,.15);border-color:rgba(74,222,128,.3);color:var(--green)}
.btn.selected{background:var(--brand);color:#06222c;border-color:var(--brand)}

/* ── Concept Map ── */
.concept-map{position:relative;min-height:320px;margin:8px 0}
.map-node{position:absolute;background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s var(--ease);text-align:center;z-index:2;-webkit-tap-highlight-color:transparent}
.map-node:active{transform:scale(.95)}
.map-node.active{border-color:var(--brand);background:var(--brand-dim);box-shadow:0 0 20px rgba(97,218,251,.2)}
.map-node .icon{font-size:22px;display:block;margin-bottom:4px}
.map-node .label{font-family:var(--mono);font-size:12px;color:var(--brand)}
.map-line{position:absolute;z-index:1}
.map-desc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;color:var(--muted);animation:fadeUp .25s var(--ease);margin-top:8px}

/* ── Code ── */
pre{background:#080b14;border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.55;margin:0}
code{font-family:var(--mono)}
.hl-kw{color:#c792ea}.hl-fn{color:var(--brand)}.hl-str{color:#c3e88d}.hl-num{color:var(--amber)}.hl-cm{color:#5a6180;font-style:italic}.hl-err{color:var(--red);text-decoration:wavy underline var(--red)}

/* ── Drag/Drop ── */
.drag-zone{display:flex;flex-direction:column;gap:8px}
.drag-item{background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:12px 16px;font-size:15px;cursor:grab;touch-action:none;user-select:none;transition:all .15s var(--ease);display:flex;align-items:center;gap:10px}
.drag-item:active{cursor:grabbing}
.drag-item .handle{color:var(--muted);font-size:18px;flex-shrink:0}
.drag-item.dragging{opacity:.5;border-color:var(--brand)}
.drag-item.over{border-color:var(--brand);background:var(--brand-dim)}
.drag-item.correct{border-color:var(--green);background:rgba(74,222,128,.08)}
.drag-item.wrong{border-color:var(--red);background:rgba(248,113,113,.08)}
.drop-slot{min-height:48px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;transition:all .15s var(--ease)}
.drop-slot.over{border-color:var(--brand);background:var(--brand-dim)}
.drop-slot.filled{border-style:solid;border-color:var(--brand);background:var(--brand-dim)}

/* ── Match ── */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-item{background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:12px;font-size:14px;cursor:pointer;transition:all .15s var(--ease);text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center}
.match-item.selected{border-color:var(--brand);background:var(--brand-dim)}
.match-item.correct{border-color:var(--green);background:rgba(74,222,128,.1)}
.match-item.wrong{border-color:var(--red);background:rgba(248,113,113,.1)}
.match-item.matched{opacity:.5;pointer-events:none}

/* ── Code Fill ── */
.code-fill{position:relative}
.code-fill input{font-family:var(--mono);font-size:13px;background:rgba(97,218,251,.1);border:1px dashed var(--brand);color:var(--brand);padding:2px 8px;border-radius:6px;width:auto;min-width:80px;outline:none}
.code-fill input:focus{border-style:solid;box-shadow:0 0 0 2px rgba(97,218,251,.2)}
.code-fill input.correct{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.1)}
.code-fill input.wrong{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.1)}

/* ── Spot Bug ── */
.code-lines{list-style:none;font-family:var(--mono);font-size:13px;line-height:1.6}
.code-line{padding:4px 12px;cursor:pointer;border-radius:8px;transition:all .12s;border:2px solid transparent;display:flex;gap:8px}
.code-line:hover,.code-line:active{background:rgba(255,255,255,.04)}
.code-line .ln{color:var(--muted);min-width:20px;text-align:right;user-select:none}
.code-line.selected{border-color:var(--amber);background:rgba(255,180,84,.08)}
.code-line.correct-line{border-color:var(--green);background:rgba(74,222,128,.08)}
.code-line.wrong-line{border-color:var(--red);background:rgba(248,113,113,.08)}

/* ── Inputs ── */
textarea{font:inherit;font-size:15px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);min-height:100px;width:100%;resize:vertical;line-height:1.5}
textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
input[type="text"]{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);min-height:48px;width:100%}
input[type="text"]:focus{outline:2px solid var(--brand);outline-offset:1px}

/* ── Feedback ── */
.feedback{border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.5;animation:fadeUp .25s var(--ease)}
.feedback.good{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:var(--green)}
.feedback.bad{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red)}
.feedback.info{background:rgba(97,218,251,.08);border:1px solid rgba(97,218,251,.2);color:var(--brand)}
.feedback .why{color:var(--text);margin-top:6px;font-size:13px}

/* ── Confidence ── */
.confidence-row{display:flex;gap:6px;flex-wrap:wrap}
.conf-btn{flex:1;min-width:0}

/* ── Dashboard ── */
.dash-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;justify-content:flex-end;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dash-panel{width:min(380px,90vw);background:var(--bg2);border-left:1px solid var(--line);padding:20px;overflow-y:auto;animation:slideLeft .3s var(--ease)}
@keyframes slideLeft{from{transform:translateX(100%)}to{transform:none}}
.dash-section{margin-bottom:20px}
.dash-title{font-size:18px;font-weight:700;margin-bottom:14px}
.dash-stat{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.dash-stat .label{color:var(--muted);font-size:14px}
.dash-stat .value{font-family:var(--mono);font-weight:700;font-size:15px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.meter-fill{height:100%;border-radius:4px;transition:width .5s var(--ease)}
.meter-fill.brand{background:var(--brand)}
.meter-fill.green{background:var(--green)}
.meter-fill.amber{background:var(--amber)}
.meter-fill.red{background:var(--red)}
.weak-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.weak-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center}

/* ── Pill / Tag ── */
.pill{font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.pill.brand{background:var(--brand-dim);color:var(--brand);border:1px solid rgba(97,218,251,.25)}
.pill.green{background:rgba(74,222,128,.1);color:var(--green);border:1px solid rgba(74,222,128,.25)}
.pill.amber{background:rgba(255,180,84,.1);color:var(--amber);border:1px solid rgba(255,180,84,.25)}
.pill.red{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.25)}
.pill.purple{background:rgba(124,92,255,.1);color:var(--purple);border:1px solid rgba(124,92,255,.25)}

/* ── Choice grid ── */
.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .15s var(--ease);font-size:15px;text-align:left;-webkit-tap-highlight-color:transparent}
.choice:active{transform:scale(.98)}
.choice.selected{border-color:var(--brand);background:var(--brand-dim)}
.choice.correct{border-color:var(--green);background:rgba(74,222,128,.1)}
.choice.wrong{border-color:var(--red);background:rgba(248,113,113,.1)}
.choice code{font-size:13px;background:rgba(255,255,255,.06);padding:1px 6px;border-radius:4px}

/* ── Scenario box ── */
.scenario{background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden}
.scenario::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--brand))}
.scenario-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--purple);margin-bottom:8px}
.scenario-text{font-size:15px;line-height:1.55}

/* ── Key concepts ── */
.key-concepts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kc{font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);color:var(--muted);transition:all .2s}
.kc.found{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.08)}
.kc.missing{border-color:var(--amber);color:var(--amber);background:rgba(255,180,84,.08)}

/* ── Misc ── */
.divider{height:1px;background:var(--line);margin:4px 0}
.gap-sm{gap:8px}.gap-md{gap:12px}.gap-lg{gap:16px}
.flex-col{display:flex;flex-direction:column}
.flex-row{display:flex;align-items:center}
.flex-wrap{flex-wrap:wrap}
.text-center{text-align:center}
.text-sm{font-size:13px}.text-xs{font-size:11px}
.mt-xs{margin-top:4px}.mt-sm{margin-top:8px}.mt-md{margin-top:12px}
.w-full{width:100%}
.mono{font-family:var(--mono)}
.brand{color:var(--brand)}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.purple{color:var(--purple)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;background:var(--card2);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}

@media(min-width:600px){
  .screen{padding:28px 24px 40px;max-width:640px;margin:0 auto}
  .match-grid{gap:14px}
}
@media(min-width:900px){
  .screen{max-width:720px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ═══════════════════════════════════════════
   CONTENT DATA — useRef mastery screens
   ═══════════════════════════════════════════ */

const PHASES = [
  {id:"map",name:"Mental Map",icon:"\u{1F5FA}"},
  {id:"predict",name:"Predict",icon:"\u{1F914}"},
  {id:"learn",name:"Learn",icon:"\u{1F4A1}"},
  {id:"build",name:"Build",icon:"\u{1F6E0}"},
  {id:"recall",name:"Recall",icon:"\u{1F9E0}"},
  {id:"edge",name:"Edge Cases",icon:"\u{26A0}"},
  {id:"teach",name:"Teach",icon:"\u{1F4AC}"},
  {id:"real",name:"Real World",icon:"\u{1F30D}"},
  {id:"challenge",name:"Challenge",icon:"\u{1F525}"},
  {id:"mastery",name:"Mastery",icon:"\u{1F3C6}"}
];

const STEPS = [

// ── Phase 0: MENTAL MAP ──
{
  id:"map1", phase:0, type:"map",
  title:"The Ref Escape Hatch",
  subtitle:"Tap each node to understand how useRef fits into a React component.",
  nodes:[
    {id:"component",x:50,y:6,icon:"\u{1F4E6}",label:"Component",desc:"A function that returns UI. Runs again on every render — but refs survive between runs."},
    {id:"useref",x:50,y:32,icon:"\u{1F4CC}",label:"useRef",desc:"Creates a persistent mutable container. Returns the same object on every render."},
    {id:"current",x:50,y:55,icon:"\u{1F4E5}",label:".current",desc:"The single property on a ref object. You read and write this freely — it's your escape hatch from React's rules."},
    {id:"dom",x:18,y:80,icon:"\u{1F3AF}",label:"DOM Access",desc:"Attach a ref to a JSX element via the ref attribute. After render, ref.current points to the real DOM node."},
    {id:"persist",x:82,y:80,icon:"\u{1F4BE}",label:"Persistent Value",desc:"Store any mutable value (timer IDs, previous props, counters) that should NOT trigger a re-render when changed."},
    {id:"norerender",x:50,y:98,icon:"\u{1F6AB}",label:"No Re-render",desc:"Unlike useState, changing ref.current never causes a re-render. React doesn't even know it changed."}
  ],
  edges:[["component","useref"],["useref","current"],["current","dom"],["current","persist"],["dom","norerender"],["persist","norerender"]]
},

// ── Phase 1: PREDICT ──
{
  id:"pred1", phase:1, type:"predict",
  question:"You need to store a timer ID so you can cancel it later, but you don't want changing it to re-render. What would you use?",
  choices:[
    {text:"A regular local variable inside the component",correct:false},
    {text:"useState to store the timer ID",correct:false},
    {text:"useRef to store the timer ID",correct:true}
  ],
  reveal:"useRef is perfect here. A local variable resets every render, so you'd lose the timer ID. useState would work but would trigger an unnecessary re-render every time you save a new timer ID. useRef persists the value without re-rendering — exactly what you need for background bookkeeping.",
  why_others:[
    "A local variable is destroyed and recreated each time the component function runs. The timer ID from the previous render would be gone.",
    "useState would preserve the value, but calling the setter triggers a re-render. Storing a timer ID doesn't affect what the user sees, so re-rendering is wasted work."
  ]
},
{
  id:"pred2", phase:1, type:"predict",
  question:"How do you access a raw DOM element (like to focus an input) in React?",
  choices:[
    {text:"Use document.querySelector to find it by class or ID",correct:false},
    {text:"Create a ref with useRef and attach it to the element via the ref attribute",correct:true},
    {text:"Access it through the event object only",correct:false}
  ],
  reveal:"React manages the DOM for you, so reaching in with querySelector is fragile — elements may not exist yet or may change identity between renders. Instead, you create a ref with useRef(), pass it as the ref prop on a JSX element, and React fills in ref.current with the actual DOM node after rendering.",
  why_others:[
    "querySelector works but bypasses React. It's fragile, can grab wrong elements, and won't work during server rendering. The React way is refs.",
    "The event object (e.target) gives you the element that triggered the event, but you can't use it for elements that weren't just interacted with — like focusing a different input on mount."
  ]
},

// ── Phase 2: LEARN (tiny chunks) ──
{
  id:"chunk1", phase:2, type:"info",
  title:"useRef creates a persistent box",
  visual:"code",
  code:'<span class="hl-kw">const</span> myRef = <span class="hl-fn">useRef</span>(<span class="hl-num">0</span>);\n\n<span class="hl-cm">// myRef is always the same object: { current: 0 }</span>\n<span class="hl-cm">// You can read it:  myRef.current</span>\n<span class="hl-cm">// You can write it: myRef.current = 42</span>',
  points:[
    "<b>useRef(initialValue)</b> — creates an object <code>{ current: initialValue }</code>",
    "Unlike useState, it returns a <b>plain object</b>, not an array",
    "React returns the <b>same object</b> on every render — it persists across re-renders"
  ],
  key_idea:"Think of useRef as a box with a single shelf labeled .current. You can put anything on that shelf, and React will never touch it or react to changes."
},
{
  id:"chunk2", phase:2, type:"info",
  title:"Changing .current does NOT re-render",
  visual:"flow",
  flow_steps:["You write ref.current = newValue","The value is stored immediately","React does NOT know it changed","No re-render is triggered","The screen stays exactly the same"],
  key_idea:"This is the key difference from useState. State changes trigger re-renders; ref changes are invisible to React. That makes refs perfect for values that shouldn't affect what the user sees."
},
{
  id:"chunk3", phase:2, type:"info",
  title:"Attaching refs to DOM elements",
  visual:"code",
  code:'<span class="hl-kw">function</span> <span class="hl-fn">TextInput</span>() {\n  <span class="hl-kw">const</span> inputRef = <span class="hl-fn">useRef</span>(<span class="hl-kw">null</span>);\n\n  <span class="hl-kw">function</span> <span class="hl-fn">handleClick</span>() {\n    inputRef.current.<span class="hl-fn">focus</span>();\n  }\n\n  <span class="hl-kw">return</span> (\n    &lt;&gt;\n      &lt;input <span class="hl-fn">ref</span>={inputRef} /&gt;\n      &lt;button <span class="hl-fn">onClick</span>={handleClick}&gt;Focus&lt;/button&gt;\n    &lt;/&gt;\n  );\n}',
  points:[
    "Pass <code>ref={myRef}</code> on a JSX element",
    "After React renders the element, <code>myRef.current</code> is set to the real DOM node",
    "Initialize with <b>null</b> because the DOM node doesn't exist yet when useRef runs"
  ],
  key_idea:"When you attach a ref to a JSX element, React automatically sets ref.current to the DOM node after mount, and back to null when unmounted."
},

// ── Phase 3: BUILD (active construction) ──
{
  id:"build1", phase:3, type:"order",
  title:"Ref vs. State: the update lifecycle",
  instruction:"Arrange these steps in the correct order for what happens when you write ref.current = newValue inside an event handler.",
  items:[
    {id:"a",text:"User triggers an event (e.g., clicks a button)"},
    {id:"b",text:"Event handler runs"},
    {id:"c",text:"ref.current is updated immediately in place"},
    {id:"d",text:"The handler finishes"},
    {id:"e",text:"No re-render is scheduled"},
    {id:"f",text:"Screen stays the same (ref change is silent)"}
  ],
  correct_order:["a","b","c","d","e","f"],
  feedback:"This is the key difference from state. With setState, step 5 would be 'React schedules a re-render' and step 6 would be 'screen updates.' With refs, nothing re-renders — the value is stored silently. This is why refs are perfect for bookkeeping values like timer IDs or previous-render snapshots."
},
{
  id:"build2", phase:3, type:"fill",
  title:"Complete the useRef + focus pattern",
  instruction:"Fill in the blanks to create a ref, attach it to an input, and focus on button click.",

/* ═══════════════════════════════════════════
   LEARNING ENGINE
   ═══════════════════════════════════════════ */

const APP = {
  step: 0,
  scores: {},
  confidence: {},
  attempts: {},
  times: {},
  startTime: Date.now(),
  stepStart: Date.now(),
  showDashboard: false,
  gateOpen: {},
  mapVisited: {}
};

function save(){
  try{
    localStorage.setItem("useRef_mastery",JSON.stringify({
      step:APP.step,scores:APP.scores,confidence:APP.confidence,
      attempts:APP.attempts,times:APP.times,gateOpen:APP.gateOpen
    }));
  }catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem("useRef_mastery"));
    if(d){Object.assign(APP,d);APP.stepStart=Date.now();}
  }catch(e){}
}
load();

function totalSteps(){return STEPS.length}
function pct(){return Math.round((APP.step/(totalSteps()-1))*100)}
function phaseOf(i){return STEPS[i]?PHASES[STEPS[i].phase]:PHASES[0]}
function isGated(i){
  const s=STEPS[i];
  if(!s)return false;
  return["predict","order","fill","match","spot","recall","explain","scenario"].includes(s.type);
}

function accuracy(){
  const ids=Object.keys(APP.scores);
  if(!ids.length)return 0;
  return Math.round(ids.reduce((s,k)=>s+APP.scores[k],0)/ids.length*100);
}

function weakAreas(){
  const weak=[];
  Object.keys(APP.scores).forEach(k=>{
    if(APP.scores[k]<1){
      const st=STEPS.find(s=>s.id===k);
      if(st)weak.push({id:k,title:st.title||st.question?.slice(0,40)+"...",score:APP.scores[k]});
    }
  });
  return weak;
}

/* ═══════════════════════════════════════════
   RENDERERS
   ═══════════════════════════════════════════ */

function render(){
  APP.stepStart=Date.now();
  const app=document.getElementById("app");
  const step=STEPS[APP.step];
  const ph=phaseOf(APP.step);

  app.innerHTML=`
    <div class="topbar">
      <a class="back" href="index.html">←</a>
      <span class="spacer"></span>
      <span class="pill brand">${ph.icon} ${ph.name}</span>
      <span class="spacer"></span>
      <button class="btn sm ghost" onclick="toggleDash()">\u{1F4CA}</button>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct()}%"></div></div>
    <div class="screen-wrap" id="sw"><div class="screen" id="scr"></div></div>
    <div class="bottombar">
      <button class="btn sm" onclick="prev()" ${APP.step===0?"disabled":""}>Back</button>
      <span class="text-xs" style="color:var(--muted);text-align:center;flex:1">${APP.step+1} / ${totalSteps()}</span>
      <button class="btn sm primary" id="next-btn" onclick="next()" ${canAdvance()?"":isGated(APP.step)?"disabled":""}>
        ${APP.step>=totalSteps()-1?"Finish":"Next"}
      </button>
    </div>`;

  const scr=document.getElementById("scr");
  const R=RENDERERS[step.type];
  if(R)R(scr,step);
  else scr.innerHTML=`<div class="card"><div class="card-title">Unknown step type: ${step.type}</div></div>`;

  if(APP.showDashboard)showDashOverlay();
  save();
}

function canAdvance(){
  const s=STEPS[APP.step];
  return !isGated(APP.step)||APP.gateOpen[s.id];
}

function unlock(){
  APP.gateOpen[STEPS[APP.step].id]=true;
  const nb=document.getElementById("next-btn");
  if(nb)nb.disabled=false;
}

function prev(){if(APP.step>0){APP.step--;render();}}
function next(){if(APP.step<totalSteps()-1&&canAdvance()){APP.step++;render();}}

window.prev=prev;window.next=next;

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  if(e.key==="ArrowRight"||e.key==="n")next();
  if(e.key==="ArrowLeft"||e.key==="p")prev();
  if(e.key==="d")toggleDash();
});

/* ── Dashboard overlay ── */
function toggleDash(){
  APP.showDashboard=!APP.showDashboard;
  if(APP.showDashboard)showDashOverlay();
  else{const o=document.querySelector(".dash-overlay");if(o)o.remove();}
}
window.toggleDash=toggleDash;

function showDashOverlay(){
  let o=document.querySelector(".dash-overlay");
  if(o)o.remove();
  const elapsed=Math.round((Date.now()-APP.startTime)/1000);
  const mins=Math.floor(elapsed/60);
  const secs=elapsed%60;
  const acc=accuracy();
  const weak=weakAreas();
  const completed=Object.keys(APP.scores).length;
  const total=STEPS.filter(s=>isGated(STEPS.indexOf(s))).length;

  o=document.createElement("div");
  o.className="dash-overlay";
  o.onclick=e=>{if(e.target===o)toggleDash();};
  o.innerHTML=`
    <div class="dash-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div class="dash-title">\u{1F4CA} Mastery Dashboard</div>
        <button class="btn sm ghost" onclick="toggleDash()">✕</button>
      </div>

      <div class="dash-section">
        <div class="dash-stat"><span class="label">Progress</span><span class="value">${pct()}%</span></div>
        <div class="meter"><div class="meter-fill brand" style="width:${pct()}%"></div></div>
      </div>

      <div class="dash-section">
        <div class="dash-stat"><span class="label">Accuracy</span><span class="value ${acc>=80?"green":acc>=50?"amber":"red"}">${acc}%</span></div>
        <div class="meter"><div class="meter-fill ${acc>=80?"green":acc>=50?"amber":"red"}" style="width:${acc}%"></div></div>
      </div>

      <div class="dash-section">
        <div class="dash-stat"><span class="label">Questions answered</span><span class="value">${completed} / ${total}</span></div>
        <div class="dash-stat"><span class="label">Time spent</span><span class="value">${mins}m ${secs}s</span></div>
        <div class="dash-stat"><span class="label">Current phase</span><span class="value">${phaseOf(APP.step).name}</span></div>
      </div>

      ${weak.length?`
      <div class="dash-section">
        <div style="font-size:14px;font-weight:600;color:var(--amber);margin-bottom:8px">⚠ Needs reinforcement</div>
        <ul class="weak-list">
          ${weak.map(w=>`<li class="weak-item"><span>${w.title}</span><span class="pill red">${Math.round(w.score*100)}%</span></li>`).join("")}
        </ul>
      </div>`:""}

      <div class="dash-section">
        <div style="font-size:14px;font-weight:600;margin-bottom:8px">Phase progress</div>
        ${PHASES.slice(0,-1).map((ph,i)=>{
          const stepsInPhase=STEPS.filter(s=>s.phase===i);
          const doneInPhase=stepsInPhase.filter(s=>APP.gateOpen[s.id]||!isGated(STEPS.indexOf(s))).length;
          const phPct=stepsInPhase.length?Math.round(doneInPhase/stepsInPhase.length*100):0;
          return`<div class="dash-stat"><span class="label">${ph.icon} ${ph.name}</span><span class="value">${phPct}%</span></div>`;
        }).join("")}
      </div>

      <button class="btn w-full" onclick="resetProgress()" style="margin-top:8px">\u{1F504} Reset progress</button>
    </div>`;
  document.getElementById("app").appendChild(o);
}

function resetProgress(){
  if(confirm("Reset all progress?")){
    APP.step=0;APP.scores={};APP.confidence={};APP.attempts={};APP.times={};APP.gateOpen={};APP.mapVisited={};
    APP.showDashboard=false;
    localStorage.removeItem("useRef_mastery");
    render();
  }
}
window.resetProgress=resetProgress;

/* ═══════════════════════════════════════════
   SCREEN TYPE RENDERERS
   ═══════════════════════════════════════════ */

const RENDERERS={

/* ── Concept Map ── */
map(el,step){
  let html=`<div class="card-header">${step.subtitle}</div>
    <div class="card-title">${step.title}</div>
    <div class="concept-map" id="cmap">`;
  step.nodes.forEach(n=>{
    const visited=APP.mapVisited[n.id];
    html+=`<div class="map-node ${visited?"active":""}" style="left:${n.x}%;top:${n.y}%;transform:translate(-50%,-50%)" data-node="${n.id}">
      <span class="icon">${n.icon}</span>
      <span class="label">${n.label}</span>
    </div>`;
  });
  html+=`</div><div id="map-desc"></div>`;
  const allVisited=step.nodes.every(n=>APP.mapVisited[n.id]);
  if(!allVisited)html+=`<div class="pill amber mt-sm">Tap all ${step.nodes.length} nodes to continue</div>`;
  el.innerHTML=html;

  const cmap=document.getElementById("cmap");
  drawMapLines(cmap,step);

  cmap.querySelectorAll(".map-node").forEach(nd=>{
    nd.onclick=()=>{
      const nid=nd.dataset.node;
      APP.mapVisited[nid]=true;
      nd.classList.add("active");
      const info=step.nodes.find(n=>n.id===nid);
      document.getElementById("map-desc").innerHTML=`<div class="map-desc"><b>${info.label}:</b> ${info.desc}</div>`;
      if(step.nodes.every(n=>APP.mapVisited[n.id]))unlock();
      save();
    };
  });
  if(allVisited)unlock();
},

/* ── Prediction / Multiple Choice ── */
predict(el,step){
  let answered=APP.scores[step.id]!==undefined;
  let html=`<div class="card-header">${step.difficulty>=4?"\u{1F525} Challenge":"Predict"}</div>
    <div class="card-title" style="font-size:16px;line-height:1.5;font-weight:500;white-space:pre-line">${esc(step.question)}</div>`;
  if(step.code)html+=`<pre style="margin:12px 0"><code>${step.code}</code></pre>`;
  html+=`<div class="choices" id="choices">`;
  step.choices.forEach((c,i)=>{
    const cls=answered?(c.correct?"correct":(APP.attempts[step.id]===i?"wrong":"")):"";
    html+=`<div class="choice ${cls}" data-i="${i}" ${answered?"":""}>${c.text}</div>`;
  });
  html+=`</div><div id="fb"></div>`;
  el.innerHTML=html;

  if(answered){
    showPredictFeedback(step);
    return;
  }

  document.querySelectorAll("#choices .choice").forEach(ch=>{
    ch.onclick=()=>{
      const i=parseInt(ch.dataset.i);
      const correct=step.choices[i].correct;
      APP.scores[step.id]=correct?1:0;
      APP.attempts[step.id]=i;
      APP.times[step.id]=Date.now()-APP.stepStart;

      document.querySelectorAll("#choices .choice").forEach((c,j)=>{
        c.classList.add(step.choices[j].correct?"correct":(j===i?"wrong":""));
        c.onclick=null;
      });
      showPredictFeedback(step);
      unlock();
      save();
    };

},

/* ── Drag to Order ── */
order(el,step){
  const answered=APP.scores[step.id]!==undefined;
  let order=answered?step.correct_order.slice():shuffle(step.items.map(i=>i.id));

  let html=`<div class="card-header">Build</div><div class="card-title">${step.title}</div>

/* ── Code Fill ── */
fill(el,step){
  const answered=APP.scores[step.id]!==undefined;
  let tpl=step.template;
  step.blanks.forEach(b=>{
    const val=answered?(b.answer):"";
    const cls=answered?"correct":"";
    tpl=tpl.replace(`____${b.id}____`,`<input type="text" class="code-fill-input ${cls}" data-blank="${b.id}" placeholder="${b.hint}" value="${esc(val)}" style="width:${Math.max(b.answer.length*9,70)}px" ${answered?"readonly":""}>`);
  });
  let html=`<div class="card-header">${step.difficulty>=4?"\u{1F525} Challenge":"Build"}</div>
    <div class="card-title">${step.title}</div>
    <div class="card-text">${step.instruction}</div>
    <pre class="code-fill" style="margin:12px 0"><code>${tpl}</code></pre>
    ${!answered?'<button class="btn primary w-full" id="check-fill">Check</button>':''}
    <div id="fb"></div>`;
  el.innerHTML=html;

  if(answered){
    document.getElementById("fb").innerHTML=`<div class="feedback good mt-md"><div class="why">${step.feedback}</div></div>`;
    return;
  }

  document.getElementById("check-fill").onclick=()=>{
    let allCorrect=true;
    step.blanks.forEach(b=>{
      const inp=document.querySelector(`[data-blank="${b.id}"]`);

      const ok=b.accept.some(a=>a.toLowerCase()===val.toLowerCase());

    });
    APP.scores[step.id]=allCorrect?1:0.5;

    document.getElementById("check-fill").remove();
    document.getElementById("fb").innerHTML=`
      <div class="feedback ${allCorrect?"good":"bad"} mt-md">
        <b>${allCorrect?"All correct!":"Some blanks need fixing."}</b>
        <div class="why">${step.feedback}</div>
      </div>`;

  };
},

match(el,step){

/* ── Spot the Bug ── */
spot(el,step){
  const answered=APP.scores[step.id]!==undefined;
  let html=`<div class="card-header">⚠ Edge Case</div><div class="card-title">${step.title}</div>
    <div class="card-text">${step.instruction}</div>
    <ul class="code-lines" id="clines">`;
  step.lines.forEach(l=>{
    const cls=answered?(l.bug?"correct-line":(APP.attempts[step.id]?.includes(l.num)?"wrong-line":"")):"";
    html+=`<li class="code-line ${cls}" data-num="${l.num}" ${l.code?"":'style="height:12px"'}><span class="ln">${l.num}</span><span>${colorize(l.code)}</span></li>`;
  });
  html+=`</ul>`;
  if(!answered)html+=`<button class="btn primary w-full mt-md" id="check-spot">Check selection</button>`;
  html+=`<div id="fb"></div>`;
  el.innerHTML=html;

  if(answered){
    showSpotFeedback(step);
    return;
  }

  let selectedLines=new Set();
  document.querySelectorAll("#clines .code-line").forEach(ln=>{
    if(!ln.textContent.trim())return;
    ln.onclick=()=>{
      const num=parseInt(ln.dataset.num);
      if(selectedLines.has(num)){selectedLines.delete(num);ln.classList.remove("selected");}
      else{selectedLines.add(num);ln.classList.add("selected");}
    };
  });

  document.getElementById("check-spot").onclick=()=>{
    const bugLines=step.lines.filter(l=>l.bug).map(l=>l.num);
    const correct=bugLines.every(n=>selectedLines.has(n))&&[...selectedLines].every(n=>bugLines.includes(n));
    APP.scores[step.id]=correct?1:(selectedLines.size>0?0.3:0);
    APP.attempts[step.id]=[...selectedLines];
    APP.times[step.id]=Date.now()-APP.stepStart;

    document.querySelectorAll("#clines .code-line").forEach(ln=>{
      const num=parseInt(ln.dataset.num);
      const isBug=bugLines.includes(num);
      ln.classList.remove("selected");
      if(isBug)ln.classList.add("correct-line");
      else if(selectedLines.has(num))ln.classList.add("wrong-line");
      ln.onclick=null;
    });
    document.getElementById("check-spot").remove();
    showSpotFeedback(step);
    unlock();save();
  };
},

explain(el,step){

/* ═══════════════════════════════════════════
   HELPER FUNCTIONS
   ═══════════════════════════════════════════ */

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function colorize(code){
  return code
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/(const|let|var|function|return|if|else|switch|case|default|new|typeof|import|export|from|async|await)\b/g,'<span class="hl-kw">$1</span>')
    .replace(/\b(useState|useEffect|useRef|useContext|useReducer|useMemo|useCallback|fetch|console|setInterval|clearInterval|setTimeout|clearTimeout|JSON|Object|Array)\b/g,'<span class="hl-fn">$1</span>')
    .replace(/(["'`])(?:(?!\1).)*?\1/g,'<span class="hl-str">$&</span>')
    .replace(/\b(\d+)\b/g,'<span class="hl-num">$1</span>')
    .replace(/(\/\/.*)/g,'<span class="hl-cm">$1</span>');
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  if(a.every((v,i)=>v===arr[i]))return shuffle(a);
  return a;
}

/* ── Drag to Order ── */
function renderOrder(step,order,done){
  const zone=document.getElementById("dzone");
  zone.innerHTML="";
  order.forEach((id,i)=>{
    const item=step.items.find(x=>x.id===id);
    const d=document.createElement("div");
    d.className="drag-item"+(done?(id===step.correct_order[i]?" correct":" wrong"):"");
    d.dataset.id=id;
    d.dataset.idx=i;
    d.innerHTML=`<span class="handle">☰</span><span class="pill brand" style="min-width:24px;justify-content:center">${i+1}</span><span>${item.text}</span>`;
    zone.appendChild(d);
  });
}

function initDragOrder(step,order){
  const zone=document.getElementById("dzone");
  let dragIdx=null;

  zone.addEventListener("pointerdown",e=>{
    const item=e.target.closest(".drag-item");
    if(!item)return;
    dragIdx=parseInt(item.dataset.idx);
    item.classList.add("dragging");
    item.setPointerCapture(e.pointerId);
  });

  zone.addEventListener("pointermove",e=>{
    if(dragIdx===null)return;
    const items=[...zone.querySelectorAll(".drag-item")];
    const rects=items.map(i=>i.getBoundingClientRect());
    items.forEach((item,i)=>{
      item.classList.toggle("over",i!==dragIdx&&e.clientY>=rects[i].top&&e.clientY<=rects[i].bottom);
    });
  });

  zone.addEventListener("pointerup",e=>{
    if(dragIdx===null)return;
    const items=[...zone.querySelectorAll(".drag-item")];
    const rects=items.map(i=>i.getBoundingClientRect());
    let dropIdx=dragIdx;
    rects.forEach((r,i)=>{
      if(i!==dragIdx&&e.clientY>=r.top&&e.clientY<=r.bottom)dropIdx=i;
    });
    if(dropIdx!==dragIdx){
      const [moved]=order.splice(dragIdx,1);
      order.splice(dropIdx,0,moved);
    }
    items.forEach(i=>{i.classList.remove("dragging","over");});
    dragIdx=null;
    renderOrder(step,order,false);
    initDragOrder(step,order);
  });
}

/* ── Match ── */
function renderMatch(step,matched,selected,done){
  const grid=document.getElementById("mgrid");
  grid.innerHTML="";

  const col1=document.createElement("div");
  col1.className="flex-col gap-sm";
  const col2=document.createElement("div");
  col2.className="flex-col gap-sm";

  step.left.forEach(l=>{
    const isMatched=matched.some(m=>m.l===l.id);
    const d=document.createElement("div");
    d.className="match-item"+(isMatched?" matched correct":"")+(selected.left===l.id?" selected":"");
    d.textContent=l.text;
    d.dataset.side="left";
    d.dataset.id=l.id;
    if(!done&&!isMatched)d.onclick=()=>handleMatchClick("left",l.id,step,matched,selected,done);
    col1.appendChild(d);
  });
  step.right.forEach(r=>{
    const isMatched=matched.some(m=>m.r===r.id);
    const d=document.createElement("div");
    d.className="match-item"+(isMatched?" matched correct":"")+(selected.right===r.id?" selected":"");
    d.textContent=r.text;
    d.dataset.side="right";
    d.dataset.id=r.id;
    if(!done&&!isMatched)d.onclick=()=>handleMatchClick("right",r.id,step,matched,selected,done);
    col2.appendChild(d);
  });
  grid.appendChild(col1);
  grid.appendChild(col2);
}

function handleMatchClick(side,id,step,matched,selected,done){
  selected[side]=id;
  if(selected.left&&selected.right){
    const isCorrectPair=step.pairs.some(p=>p[0]===selected.left&&p[1]===selected.right);
    if(isCorrectPair){
      matched.push({l:selected.left,r:selected.right});
      if(matched.length===step.pairs.length){
        APP.scores[step.id]=1;
        APP.times[step.id]=Date.now()-APP.stepStart;
        document.getElementById("fb").innerHTML=`<div class="feedback good mt-md"><b>All matched!</b><div class="why">${step.feedback}</div></div>`;
        unlock();save();
        renderMatch(step,matched,{left:null,right:null},true);
        return;
      }
    }else{
      const items=document.querySelectorAll(".match-item.selected");
      items.forEach(i=>{i.classList.add("wrong");});
      setTimeout(()=>{items.forEach(i=>{i.classList.remove("wrong","selected");});},500);
    }
    selected.left=null;selected.right=null;
  }
  renderMatch(step,matched,selected,done);
}

/* ── Concept Map Lines (CSS-based) ── */
function drawMapLines(container,step){
  const update=()=>{
    container.querySelectorAll(".map-line").forEach(l=>l.remove());
    const nodes={};
    container.querySelectorAll(".map-node").forEach(n=>{
      const r=n.getBoundingClientRect();
      const cr=container.getBoundingClientRect();
      nodes[n.dataset.node]={x:r.left-cr.left+r.width/2,y:r.top-cr.top+r.height/2};
    });
    step.edges.forEach(([from,to])=>{
      if(!nodes[from]||!nodes[to])return;
      const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
      svg.classList.add("map-line");
      svg.style.cssText=`position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible`;
      const line=document.createElementNS("http://www.w3.org/2000/svg","line");
      line.setAttribute("x1",nodes[from].x);line.setAttribute("y1",nodes[from].y);
      line.setAttribute("x2",nodes[to].x);line.setAttribute("y2",nodes[to].y);
      line.setAttribute("stroke","rgba(97,218,251,0.2)");line.setAttribute("stroke-width","2");
      line.setAttribute("stroke-dasharray","6 4");
      svg.appendChild(line);
      container.appendChild(svg);
    });
  };
  setTimeout(update,50);
  window.addEventListener("resize",update);
}

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
render();

})();
</script>
