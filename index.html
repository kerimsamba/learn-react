<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Learn React Hooks — Interactive Mastery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--bg2:#111627;--card:#181d30;--card2:#1e2540;
  --line:#2a3155;--text:#e4e8f7;--muted:#8b93b8;
  --brand:#61dafb;--brand-dim:rgba(97,218,251,.12);
  --purple:#7c5cff;--green:#4ade80;--red:#f87171;--amber:#ffb454;
  --radius:16px;--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100dvh;-webkit-font-smoothing:antialiased}

.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(10,14,26,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .logo-area{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--text)}
.topbar .logo{width:26px;height:26px;flex-shrink:0}
.topbar .spacer{flex:1}

.wrap{max-width:720px;margin:0 auto;padding:20px 16px 80px}

.hero{text-align:center;padding:28px 8px 12px}
.hero h1{font-size:clamp(26px,7vw,42px);line-height:1.1;margin:8px 0}
.hero h1 .brand{color:var(--brand)}
.hero p{color:var(--muted);max-width:42ch;margin:0 auto;font-size:15px}

.eyebrow{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--brand);background:var(--brand-dim);border:1px solid rgba(97,218,251,.25);padding:3px 10px;border-radius:999px;margin-bottom:6px;text-transform:uppercase}

/* ── Concept Map ── */
.map-section{margin:24px 0}
.map-section h2{font-size:18px;margin-bottom:12px;text-align:center}
.concept-map{position:relative;min-height:420px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;overflow:hidden}
.map-node{position:absolute;background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:center;cursor:pointer;transition:all .25s var(--ease);z-index:2;-webkit-tap-highlight-color:transparent;min-width:100px}
.map-node:active{transform:scale(.95)}
.map-node:hover{border-color:var(--brand)}
.map-node .icon{font-size:24px;display:block}
.map-node .name{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--brand);margin-top:4px}
.map-node .desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
.map-node .ring{position:absolute;top:-3px;right:-3px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.map-node .ring.done{background:var(--green);color:#0a1a0a}
.map-node .ring.partial{background:var(--amber);color:#1a1000}
.map-node .ring.none{background:var(--line);color:var(--muted)}

.map-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* ── Hook Cards (mobile fallback) ── */
.hook-grid{display:grid;grid-template-columns:1fr;gap:12px;margin:20px 0}
@media(min-width:500px){.hook-grid{grid-template-columns:1fr 1fr}}
@media(min-width:720px){.hook-grid{grid-template-columns:1fr 1fr 1fr}}

.hook-card{display:block;text-decoration:none;color:var(--text);background:linear-gradient(160deg,var(--card) 0%,var(--card2) 100%);border:1px solid var(--line);border-radius:var(--radius);padding:16px;transition:all .2s var(--ease);position:relative;overflow:hidden}
.hook-card:active{transform:scale(.98)}
.hook-card:hover{border-color:var(--brand)}
.hook-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--purple));opacity:0;transition:opacity .2s}
.hook-card:hover::before{opacity:1}
.hook-card .num{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:4px}
.hook-card .hook-name{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--brand)}
.hook-card .hook-desc{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.hook-card .hook-icon{font-size:28px;position:absolute;top:14px;right:14px;opacity:.3}
.hook-card .progress-mini{display:flex;align-items:center;gap:6px;margin-top:10px}
.hook-card .meter{height:6px;flex:1;background:var(--line);border-radius:3px;overflow:hidden}
.hook-card .meter-fill{height:100%;border-radius:3px;transition:width .5s var(--ease)}
.hook-card .meter-fill.green{background:var(--green)}
.hook-card .meter-fill.brand{background:var(--brand)}
.hook-card .pct{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:28px;text-align:right}

/* ── How it works ── */
.how-section{margin:28px 0}
.how-section h2{font-size:18px;margin-bottom:12px}
.principle-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:600px){.principle-grid{grid-template-columns:1fr 1fr 1fr}}
.principle{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.principle .p-icon{font-size:22px}
.principle .p-name{font-size:12px;font-weight:600;margin-top:4px;color:var(--text)}
.principle .p-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}

/* ── Overall stats ── */
.stats-bar{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}
.stat-card{flex:1;min-width:100px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat-card .s-value{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--brand)}
.stat-card .s-label{font-size:11px;color:var(--muted);margin-top:2px}

.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:36px;padding:16px}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .4s var(--ease) both}
.fade-up-1{animation-delay:.05s}.fade-up-2{animation-delay:.1s}.fade-up-3{animation-delay:.15s}
.fade-up-4{animation-delay:.2s}.fade-up-5{animation-delay:.25s}.fade-up-6{animation-delay:.3s}

.pill{font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.pill.brand{background:var(--brand-dim);color:var(--brand);border:1px solid rgba(97,218,251,.25)}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo-area">
    <svg class="logo" viewBox="-11.5 -10.23 23 20.46" fill="none" aria-hidden="true">
      <circle r="2" fill="#61dafb"></circle>
      <g stroke="#61dafb" stroke-width="1"><ellipse rx="11" ry="4.2"></ellipse><ellipse rx="11" ry="4.2" transform="rotate(60)"></ellipse><ellipse rx="11" ry="4.2" transform="rotate(120)"></ellipse></g>
    </svg>
    React Hooks Mastery
  </div>
  <span class="spacer"></span>
  <span class="pill brand">interactive</span>
</header>

<main class="wrap" id="main"></main>

<script>
(function(){
"use strict";

const HOOKS = [
  { id:"useState",     file:"usestate.html",         key:"useState_mastery",     num:"01", icon:"\u{1F4BE}", name:"useState",             desc:"Remember a value and re-render when it changes.", color:"#61dafb" },
  { id:"useEffect",    file:"useeffect.html",         key:"useEffect_mastery",    num:"02", icon:"\u{1F514}", name:"useEffect",            desc:"Run side-effects after render: fetching, timers, subscriptions.", color:"#c792ea" },
  { id:"useRef",       file:"useref.html",            key:"useRef_mastery",       num:"03", icon:"\u{1F4CC}", name:"useRef",               desc:"Keep a value or DOM node without causing re-renders.", color:"#c3e88d" },
  { id:"useContext",   file:"usecontext.html",         key:"useContext_mastery",   num:"04", icon:"\u{1F4FB}", name:"useContext",           desc:"Share data deep in the tree without passing props.", color:"#ffb454" },
  { id:"useReducer",   file:"usereducer.html",         key:"useReducer_mastery",   num:"05", icon:"\u{1F3E7}", name:"useReducer",           desc:"Manage complex state with clear actions.", color:"#f78c6c" },
  { id:"useMemoCallback", file:"usememo-callback.html", key:"useMemo_mastery",   num:"06", icon:"\u{1F9EE}", name:"useMemo / useCallback", desc:"Skip expensive work and keep references stable.", color:"#82aaff" }
];

const MAP_POS = [
  { x: 50, y: 12 },
  { x: 82, y: 30 },
  { x: 82, y: 58 },
  { x: 18, y: 30 },
  { x: 18, y: 58 },
  { x: 50, y: 78 }
];

const MAP_EDGES = [
  [0, 1], [0, 3], [1, 2], [3, 4], [0, 4], [2, 5], [4, 5], [1, 5]
];

function getProgress(key) {
  try {
    const d = JSON.parse(localStorage.getItem(key));
    if (!d) return { pct: 0, acc: 0 };
    const scores = d.scores || {};
    const step = d.step || 0;
    const ids = Object.keys(scores);
    const acc = ids.length ? Math.round(ids.reduce((s, k) => s + scores[k], 0) / ids.length * 100) : 0;
    return { pct: step > 0 ? Math.min(Math.round(step / 18 * 100), 100) : 0, acc };
  } catch (e) { return { pct: 0, acc: 0 }; }
}

function renderPage() {
  const main = document.getElementById("main");
  const progresses = HOOKS.map(h => getProgress(h.key));
  const overallPct = Math.round(progresses.reduce((s, p) => s + p.pct, 0) / HOOKS.length);
  const overallAcc = progresses.filter(p => p.acc > 0);
  const avgAcc = overallAcc.length ? Math.round(overallAcc.reduce((s, p) => s + p.acc, 0) / overallAcc.length) : 0;
  const started = progresses.filter(p => p.pct > 0).length;

  main.innerHTML = `
    <section class="hero fade-up">
      <span class="eyebrow">mastery-based learning</span>
      <h1><span class="brand">React Hooks</span>, mastered</h1>
      <p>Think, predict, build, debug. No passive reading — every screen demands action. Tap a hook below to begin.</p>
    </section>

    <div class="stats-bar fade-up fade-up-1">
      <div class="stat-card">
        <div class="s-value">${overallPct}%</div>
        <div class="s-label">Overall progress</div>
      </div>
      <div class="stat-card">
        <div class="s-value">${avgAcc || "—"}${avgAcc ? "%" : ""}</div>
        <div class="s-label">Accuracy</div>
      </div>
      <div class="stat-card">
        <div class="s-value">${started} / ${HOOKS.length}</div>
        <div class="s-label">Hooks started</div>
      </div>
    </div>

    <div class="map-section fade-up fade-up-2">
      <h2>Concept Map</h2>
      <div class="concept-map" id="cmap">
        <svg class="map-svg" id="map-svg"></svg>
        ${HOOKS.map((h, i) => {
          const p = progresses[i];
          const ringCls = p.pct >= 100 ? "done" : p.pct > 0 ? "partial" : "none";
          const ringText = p.pct >= 100 ? "✓" : p.pct > 0 ? p.pct + "" : "";
          return `<a href="${h.file}" class="map-node" style="left:${MAP_POS[i].x}%;top:${MAP_POS[i].y}%;transform:translate(-50%,-50%)" data-idx="${i}">
            <span class="ring ${ringCls}">${ringText}</span>
            <span class="icon">${h.icon}</span>
            <span class="name">${h.name}</span>
            <span class="desc">${h.desc.split(".")[0]}</span>
          </a>`;
        }).join("")}
      </div>
    </div>

    <h2 style="font-size:18px;margin-bottom:12px" class="fade-up fade-up-3">Pick a hook</h2>
    <div class="hook-grid">
      ${HOOKS.map((h, i) => {
        const p = progresses[i];
        return `<a href="${h.file}" class="hook-card fade-up fade-up-${i + 1}">
          <div class="num">${h.num}</div>
          <div class="hook-name">${h.name}</div>
          <div class="hook-desc">${h.desc}</div>
          <div class="hook-icon">${h.icon}</div>
          <div class="progress-mini">
            <div class="meter"><div class="meter-fill ${p.pct >= 100 ? "green" : "brand"}" style="width:${p.pct}%"></div></div>
            <span class="pct">${p.pct}%</span>
          </div>
        </a>`;
      }).join("")}
    </div>

    <div class="how-section fade-up fade-up-4">
      <h2>How this works</h2>
      <div class="principle-grid">
        <div class="principle"><div class="p-icon">\u{1F914}</div><div class="p-name">Predict first</div><div class="p-desc">You guess before you learn</div></div>
        <div class="principle"><div class="p-icon">\u{1F9E9}</div><div class="p-name">Tiny chunks</div><div class="p-desc">One idea per screen</div></div>
        <div class="principle"><div class="p-icon">\u{1F6E0}</div><div class="p-name">Build it</div><div class="p-desc">Drag, order, fill, match</div></div>
        <div class="principle"><div class="p-icon">\u{1F9E0}</div><div class="p-name">Recall</div><div class="p-desc">Retrieve from memory</div></div>
        <div class="principle"><div class="p-icon">\u{26A0}</div><div class="p-name">Edge cases</div><div class="p-desc">Spot bugs and traps</div></div>
        <div class="principle"><div class="p-icon">\u{1F30D}</div><div class="p-name">Real world</div><div class="p-desc">Production scenarios</div></div>
      </div>
    </div>

    <div class="footer">Built for mastery · plain HTML, CSS &amp; JS — works offline · no frameworks</div>
  `;

  drawLines();
  window.addEventListener("resize", drawLines);
}

function drawLines() {
  const svg = document.getElementById("map-svg");
  if (!svg) return;
  const cmap = document.getElementById("cmap");
  const cr = cmap.getBoundingClientRect();
  svg.innerHTML = "";

  const nodes = [...cmap.querySelectorAll(".map-node")].map(n => {
    const r = n.getBoundingClientRect();
    return { x: r.left - cr.left + r.width / 2, y: r.top - cr.top + r.height / 2 };
  });

  MAP_EDGES.forEach(([a, b]) => {
    if (!nodes[a] || !nodes[b]) return;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", nodes[a].x); line.setAttribute("y1", nodes[a].y);
    line.setAttribute("x2", nodes[b].x); line.setAttribute("y2", nodes[b].y);
    line.setAttribute("stroke", "rgba(97,218,251,0.12)");
    line.setAttribute("stroke-width", "1.5");
    line.setAttribute("stroke-dasharray", "5 4");
    svg.appendChild(line);
  });
}

renderPage();

})();
</script>
</body>
</html>
